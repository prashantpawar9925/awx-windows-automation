---
- name: Patch Windows Server 2022 - Security Updates Only
  hosts: Win_Server
  gather_facts: false

  tasks:

    - name: Get currently installed security updates
      ansible.windows.win_shell: |
        $updates = Get-HotFix |
          Where-Object {$_.Description -eq "Security Update"} |
          Sort-Object InstalledOn -Descending

        if ($updates) {
          $latest = $updates | Select-Object -First 1

          Write-Output "CURRENT_LATEST_KB=$($latest.HotFixID)"
          Write-Output "CURRENT_LATEST_DATE=$($latest.InstalledOn)"
        }
        else {
          Write-Output "NO_SECURITY_UPDATE_FOUND"
        }
      register: current_patch
      changed_when: false

    - name: Display currently installed latest Security Update
      ansible.builtin.debug:
        msg: "{{ current_patch.stdout_lines }}"

    - name: Install available Windows Security Updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
        state: installed
        reboot: true
        reboot_timeout: 3600
      register: windows_update_result

    - name: Display Windows Update result
      ansible.builtin.debug:
        msg:
          - "Updates found: {{ windows_update_result.found_update_count }}"
          - "Updates installed: {{ windows_update_result.installed_update_count }}"
          - "Reboot required: {{ windows_update_result.reboot_required }}"
          - "Server rebooted: {{ windows_update_result.rebooted }}"

    - name: Get latest Security Update after patching
      ansible.windows.win_shell: |
        $updates = Get-HotFix |
          Where-Object {$_.Description -eq "Security Update"} |
          Sort-Object InstalledOn -Descending

        if ($updates) {
          $latest = $updates | Select-Object -First 1

          Write-Output "LATEST_KB=$($latest.HotFixID)"
          Write-Output "LATEST_PATCH_DATE=$($latest.InstalledOn)"
        }
        else {
          Write-Output "NO_SECURITY_UPDATE_FOUND"
        }
      register: final_patch
      changed_when: false

    - name: Display final latest Security Update
      ansible.builtin.debug:
        msg: "{{ final_patch.stdout_lines }}"

    - name: Display patch status
      ansible.builtin.debug:
        msg: >-
          {% if windows_update_result.installed_update_count | int > 0 %}
          New Security Update(s) were installed.
          Latest installed Security Update: {{ final_patch.stdout_lines[0] }}
          {% else %}
          No new Security Updates were installed.
          Existing latest Security Update: {{ final_patch.stdout_lines[0] }}
          {% endif %}
